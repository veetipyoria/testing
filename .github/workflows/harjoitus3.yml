name: Math counter
on:
  issues: 
    types: [opened, edited]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
env:
  APP_NAME: MathCounter 
  APP_VERSION: v.1.0.2
  KEYWORD: lol
jobs:
  math_counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "Your app name is $APP_NAME and version is $APP_VERSION"
          printf "$KEYWORD: Push implemented\n" >> log.txt
          COUNT=$(cat counter.txt)
          COUNT=$((COUNT+1))
          echo "$COUNT" > counter.txt
          git config --global user.name 'veetipyoria'
          git config --global user.email 'vpyoria24@students.oamk.fi'
          git add .
          git commit -m 'New push info'
      - name: Handle new issue
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Assignee: {{ github.event.issue.assignee.login }}
      - name: Add issue information to README
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          echo "${{ github.event.issue.title }} - ${{ github.event.issue.assignee.login }}" >> README.md
          echo "[Issue](${{ github.event.issue.html_url }})" >> README.md
      - name: Handle issue comment
        if: github.event_name == 'issue_comment' && github.event.action == 'created'
        run: |
          echo "Comment: ${{ github.event.comment.body }}"
          echo "Comment author: ${{ github.event.comment.user.login }}" 
      - name: Show event payload
        if: github.event_name == 'issue_comment' && github.event.action == 'created'
        run: |
          echo "${{ toJson(github.event) }}"
      - name: Add issue URL to README
        if: github.event_name == 'issue_comment' && github.event.action == 'created'
        run: |
          echo "[Issue #${{ github.event.issue.number }}](${{ github.event.issue.html_url }})" >> README.md
      - name: Commit README changes
        if: github.event_name == 'issues' && github.event.action == 'opened' || github.event_name == 'issue_comment' && github.event.action == 'created'
        run: |
          git config user.name "veetipyoria"
          git config user.email "vpyoria24@students.oamk.fi"

          git add README.md
          git commit -m "Update README with issue information" || echo "No changes to commit"
          git push

    
